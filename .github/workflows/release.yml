name: Build and Release Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 1.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Writelong.Windows.sln

    - name: Build and Publish
      run: dotnet publish Writelong.Windows/Writelong.Windows.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.version }}
        name: Writelong for Windows v${{ inputs.version }}
        files: publish/Writelong.Windows.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
